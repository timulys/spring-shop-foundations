log_format shop_routes '$request_method $uri status=$status service=$proxy_host address=$upstream_addr upstream_status=$upstream_status';

upstream order_app {
    zone order_app 64k;
    resolver 127.0.0.11 valid=5s ipv6=off;
    server order:8080 resolve;
}

upstream catalog_app {
    zone catalog_app 64k;
    resolver 127.0.0.11 valid=5s ipv6=off;
    server catalog:8080 resolve;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    access_log /var/log/nginx/access.log shop_routes;

    location = /api/products {
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass http://catalog_app;
    }
    location ^~ /api/products/ {
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass http://catalog_app;
    }
    location /api/ {
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass http://order_app;
    }
    location = /login {
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass http://order_app;
    }
    location = /logout {
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass http://order_app;
    }
    location = /internal { return 404; }
    location ^~ /internal/ { return 404; }
    location = /actuator { return 404; }
    location ^~ /actuator/ { return 404; }
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }
}
