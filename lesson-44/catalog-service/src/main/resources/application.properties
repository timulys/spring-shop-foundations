spring.application.name=catalog-service
server.address=127.0.0.1
server.port=8081
spring.datasource.url=${DB_URL:jdbc:postgresql://127.0.0.1:15435/catalog}
spring.datasource.username=${DB_USER:catalog}
spring.datasource.password=${DB_PASSWORD:catalog-local-only}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.group.readiness.include=readinessState,db
spring.datasource.hikari.connection-timeout=2000
spring.datasource.hikari.validation-timeout=1000

logging.structured.format.console=ecs
logging.structured.json.stacktrace.max-length=4096
