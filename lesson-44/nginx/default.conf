map $http_x_request_id $shop_request_id {
    default $request_id;
    "~^[A-Za-z0-9_-]{8,64}$" $http_x_request_id;
}

map $uri $shop_route {
    default unmatched;
    /api/products /api/products;
    ~^/api/products/ "/api/products/{code}";
    /api/cart /api/cart;
    /api/cart/items /api/cart/items;
    ~^/api/cart/items/ "/api/cart/items/{code}";
    /api/orders /api/orders;
    /api/orders/preview /api/orders/preview;
    ~^/api/orders/[0-9]+/cancel$ "/api/orders/{id}/cancel";
    ~^/api/orders/[0-9]+$ "/api/orders/{id}";
    /api/members /api/members;
    /api/session/me /api/session/me;
    /api/csrf /api/csrf;
    /login /login;
    /logout /logout;
    / static;
}

log_format shop_routes escape=json '{"timestamp":"$time_iso8601","event":"proxy_request","requestId":"$shop_request_id","method":"$request_method","route":"$shop_route","status":$status,"service":"$proxy_host","address":"$upstream_addr","upstreamStatus":"$upstream_status","durationSeconds":$request_time}';

upstream order_app {
    zone order_app 64k;
    resolver 127.0.0.11 valid=5s ipv6=off;
    server order:8080 resolve;
}

upstream catalog_app {
    zone catalog_app 64k;
    resolver 127.0.0.11 valid=5s ipv6=off;
    server catalog:8080 resolve;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    access_log /var/log/nginx/access.log shop_routes;
    add_header X-Request-Id $shop_request_id always;

    location = /api/products {
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass http://catalog_app;
    }
    location ^~ /api/products/ {
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass http://catalog_app;
    }
    location /api/ {
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass http://order_app;
    }
    location = /login {
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass http://order_app;
    }
    location = /logout {
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass http://order_app;
    }
    location = /internal { return 404; }
    location ^~ /internal/ { return 404; }
    location = /actuator { return 404; }
    location ^~ /actuator/ { return 404; }
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
        add_header X-Request-Id $shop_request_id always;
    }
}
