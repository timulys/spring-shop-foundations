spring.application.name=order-service
server.address=127.0.0.1
server.port=8080

spring.datasource.url=${DB_URL:jdbc:postgresql://127.0.0.1:15432/shop}
spring.datasource.username=${DB_USER:shop}
spring.datasource.password=${DB_PASSWORD:shop-local-only}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

server.forward-headers-strategy=framework

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.group.readiness.include=readinessState,db
spring.datasource.hikari.connection-timeout=2000
spring.datasource.hikari.validation-timeout=1000

catalog.base-url=${CATALOG_BASE_URL:http://127.0.0.1:18081}

catalog.connect-timeout-ms=${CATALOG_CONNECT_TIMEOUT_MS:500}
catalog.attempt-timeout-ms=${CATALOG_ATTEMPT_TIMEOUT_MS:1500}
catalog.total-timeout-ms=${CATALOG_TOTAL_TIMEOUT_MS:2500}
catalog.retry-delay-ms=${CATALOG_RETRY_DELAY_MS:100}
catalog.max-attempts=${CATALOG_MAX_ATTEMPTS:2}

logging.structured.format.console=ecs
logging.structured.json.stacktrace.max-length=4096
