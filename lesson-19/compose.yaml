name: spring-shop-lesson19

services:
  db:
    image: postgres:18.4
    environment:
      POSTGRES_DB: shop
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop-local-only
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop -d shop"]
      interval: 3s
      timeout: 3s
      retries: 20

  test-db:
    image: postgres:18.4
    profiles: [test]
    environment:
      POSTGRES_DB: shop_test
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop-local-only
    ports:
      - "127.0.0.1:${TEST_POSTGRES_PORT:-15433}:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop -d shop_test"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  postgres_data:
