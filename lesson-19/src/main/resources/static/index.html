<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>작업실 상점 · 상품 찾기</title>
  <link rel="stylesheet" href="/shop.css">
  <script type="module" src="/shop.js"></script>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/">작업실 <span>상점</span></a>
    <span class="header-note">책상 위에서 매일 쓰는 도구</span>
  </header>
  <main>
    <section class="intro" aria-labelledby="page-title">
      <p class="eyebrow">작은 도구, 편안한 작업</p>
      <h1 id="page-title">나의 책상에<br>필요한 것들.</h1>
      <p class="intro-copy">키보드, 마우스, 그리고 생각을 적을 노트.<br>매일의 작업을 함께할 상품을 살펴보세요.</p>
    </section>
    <section class="catalog" aria-labelledby="catalog-title" aria-busy="false">
      <div class="catalog-heading">
        <h2 id="catalog-title">상품 찾기</h2>
        <button id="reset-search" type="button">조건 초기화</button>
      </div>
      <form id="search-form" class="search-form">
        <label>카테고리
          <select id="category" name="category">
            <option value="">전체</option>
            <option value="주변기기">주변기기</option>
            <option value="문구">문구</option>
          </select>
        </label>
        <label class="keyword-label">상품명
          <input id="keyword" name="q" type="search" maxlength="40" placeholder="예: 키보드">
        </label>
        <button type="submit" class="search-button">검색</button>
      </form>
      <p id="status" role="status" aria-live="polite">상품을 불러오는 중입니다.</p>
      <ul id="products" class="product-grid"></ul>
      <section id="product-detail" class="product-detail" aria-labelledby="detail-title" hidden>
        <div><p class="eyebrow">선택한 상품</p><h2 id="detail-title" class="detail-name"></h2></div>
        <dl>
          <div><dt>상품 코드</dt><dd class="detail-code"></dd></div>
          <div><dt>카테고리</dt><dd class="detail-category"></dd></div>
          <div><dt>가격</dt><dd class="detail-price"></dd></div>
        </dl>
      </section>
    </section>
  </main>
  <footer>작업실 상점 <span>상품 목록</span></footer>
  <template id="product-template">
    <li>
      <article class="product">
        <div class="product-visual" aria-hidden="true"><span class="product-mark"></span></div>
        <div class="product-info">
          <p class="product-code"></p>
          <h3 class="product-name"></h3>
          <p class="product-price"></p>
          <p class="product-category"></p>
          <button type="button" class="detail-button">상세 보기 →</button>
        </div>
      </article>
    </li>
  </template>
</body>
</html>
