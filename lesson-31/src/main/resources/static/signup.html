<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>회원가입 · 작업실 상점</title>
  <link rel="stylesheet" href="/shop.css"><link rel="stylesheet" href="/member.css">
  <script type="module" src="/signup.js"></script>
</head>
<body>
  <header class="site-header"><a class="brand" href="/">작업실 <span>상점</span></a><a href="/">상품 보기</a></header>
  <main class="member-main">
    <p class="eyebrow">나의 작업실 계정</p><h1>회원가입</h1>
    <p>아이디와 비밀번호를 만들어 주세요.</p>
    <form id="signup-form" class="member-form">
      <label>로그인 아이디<input name="loginId" autocomplete="username" required minlength="3" maxlength="30" pattern="[A-Za-z][A-Za-z0-9_]{2,29}" aria-describedby="login-id-help"></label>
      <p id="login-id-help" class="field-help">영문자로 시작하는 3~30자입니다. 영문자·숫자·밑줄을 사용할 수 있으며 대소문자는 구분하지 않습니다.</p>
      <label>표시 이름<input name="displayName" autocomplete="nickname" required maxlength="50"></label>
      <label>비밀번호<input name="password" type="password" autocomplete="new-password" required minlength="8" maxlength="64" aria-describedby="password-help"></label>
      <p id="password-help" class="field-help">8~64자, UTF-8 기준 72바이트 이하입니다. 한글은 보통 한 글자에 3바이트를 사용합니다.</p>
      <button class="primary-button" type="submit">가입하기</button>
    </form>
    <p id="signup-status" role="status" aria-live="polite"></p>
    <p id="signup-result" hidden></p>
  </main>
</body>
</html>
